.pk *, .pk *::before, .pk *::after { box-sizing: border-box; }
.pk {
  --tile:#D9E4DC; --grout:#BBCCC1; --ink:#1B211D; --soft:#5F6E64;
  --paper:#FBFAF6; --red:#C33127; --red-d:#9C2620;
  --amber:#F2AC24; --amber-d:#B8801A;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",monospace;
  font-family: var(--sans);
  color: var(--ink);
  background-color: var(--tile);
  background-image:
    linear-gradient(var(--grout) 1px, transparent 1px),
    linear-gradient(90deg, var(--grout) 1px, transparent 1px);
  background-size: 46px 46px;
  min-height: 100vh;
  padding: 26px 18px 64px;
  -webkit-font-smoothing: antialiased;
}
.pk-wrap { max-width: 1060px; margin: 0 auto; }

.pk button, .pk input, .pk select, .pk textarea { font: inherit; color: inherit; }
.pk :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.pk-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.pk-eyebrow { font-family:var(--mono); font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--soft); margin:0 0 6px; }
.pk-title { font-size:38px; line-height:1.05; font-weight:800; letter-spacing:-.02em; margin:0; }
.pk-sub { font-family:var(--mono); font-size:12.5px; color:var(--soft); margin:8px 0 0; }

.pk-btn { display:inline-flex; align-items:center; gap:7px; border:0; border-radius:3px; padding:11px 16px; font-weight:700; cursor:pointer; }
.pk-btn-red { background:var(--red); color:#fff; box-shadow:0 2px 0 var(--red-d); }
.pk-btn-red:hover { background:var(--red-d); }
.pk-btn-red:active { transform:translateY(1px); box-shadow:0 1px 0 var(--red-d); }
.pk-btn-ghost { background:transparent; color:var(--ink); border:1px solid #9FB3A6; }
.pk-btn-ghost:hover { background:#EAF1EC; }

/* \u71C8\u7BB1\uFF1A\u9019\u9801\u7684\u4E3B\u89D2 */
.pk-sign { display:flex; align-items:stretch; gap:0; background:var(--amber); border-radius:4px; border-bottom:5px solid var(--amber-d); box-shadow:0 6px 0 rgba(27,33,29,.12), inset 0 1px 0 rgba(255,255,255,.5); overflow:hidden; margin-bottom:26px; }
.pk-sign-body { flex:1; padding:18px 20px; min-width:0; }
.pk-sign-label { font-family:var(--mono); font-size:11px; letter-spacing:.24em; color:#6B4E0C; margin:0 0 6px; }
.pk-sign-name { font-size:34px; font-weight:800; letter-spacing:-.01em; margin:0; color:#1B211D; word-break:break-word; }
.pk-sign-name.is-idle { color:#8A6A18; font-weight:700; font-size:26px; }
.pk-sign-name.is-rolling { opacity:.55; }
.pk-sign-links { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.pk-roll { border:0; border-left:2px dashed rgba(107,78,12,.4); background:transparent; color:#5A400A; font-weight:800; cursor:pointer; padding:0 22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; letter-spacing:.06em; }
.pk-roll:hover:not(:disabled) { background:rgba(255,255,255,.35); }
.pk-roll:disabled { cursor:default; opacity:.6; }

/* \u7BE9\u9078\u5217 */
.pk-tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.pk-search { position:relative; flex:1; min-width:210px; }
.pk-search input { width:100%; padding:10px 12px 10px 36px; border:1px solid #A8BAAD; border-radius:3px; background:var(--paper); }
.pk-search input::placeholder { color:#93A399; }
.pk-search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--soft); }
.pk-chip { border:1px solid #A8BAAD; background:var(--paper); border-radius:999px; padding:7px 13px; font-size:13.5px; cursor:pointer; }
.pk-chip:hover { border-color:var(--ink); }
.pk-chip.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.pk-chip.fav.on { background:var(--amber); color:#3E2C05; border-color:var(--amber-d); }

/* \u5361\u7247 */
.pk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px; }
.pk-card { position:relative; background:var(--paper); border:1px solid #C6D2C9; border-left:4px solid var(--red); border-radius:3px; padding:15px 16px 14px; box-shadow:0 2px 6px rgba(27,33,29,.07); display:flex; flex-direction:column; gap:9px; }
.pk-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.pk-name { font-size:19px; font-weight:800; margin:0; line-height:1.25; word-break:break-word; }
.pk-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.pk-tag { font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; background:#E4ECE6; color:var(--soft); border-radius:2px; padding:3px 7px; }
.pk-note { font-size:13.5px; color:var(--soft); margin:0; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.pk-links { display:flex; flex-wrap:wrap; gap:7px; }
.pk-link { display:inline-flex; align-items:center; gap:5px; text-decoration:none; font-size:13px; font-weight:700; color:#fff; background:var(--lc,#1B211D); border-radius:3px; padding:7px 11px; }
.pk-link:hover { filter:brightness(1.12); }
.pk-tel { display:inline-flex; align-items:center; gap:5px; text-decoration:none; font-size:13px; font-weight:700; color:var(--ink); border:1px solid #A8BAAD; border-radius:3px; padding:6px 11px; }
.pk-tel:hover { background:#EAF1EC; }
.pk-nolink { font-family:var(--mono); font-size:12px; color:#93A399; }
.pk-icons { display:flex; gap:2px; }
.pk-icon { border:0; background:transparent; padding:5px; border-radius:3px; cursor:pointer; color:var(--soft); line-height:0; }
.pk-icon:hover { background:#E4ECE6; color:var(--ink); }
.pk-icon.star.on { color:var(--amber-d); }
.pk-confirm { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#FBE9E7; border:1px solid #E6B5B0; border-radius:3px; padding:9px 11px; font-size:13px; }
.pk-confirm button { border:0; background:none; font-weight:700; cursor:pointer; padding:2px 4px; }
.pk-confirm .yes { color:var(--red); }

/* \u7A7A\u72C0\u614B */
.pk-empty { background:var(--paper); border:1px dashed #A8BAAD; border-radius:4px; padding:34px 24px; text-align:center; }
.pk-empty h2 { font-size:19px; margin:0 0 8px; }
.pk-empty p { color:var(--soft); font-size:14px; margin:0 0 16px; line-height:1.6; }

/* \u8868\u55AE */
.pk-mask { position:fixed; inset:0; background:rgba(27,33,29,.55); display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; z-index:50; }
.pk-modal { background:var(--paper); border-radius:4px; width:100%; max-width:540px; box-shadow:0 18px 44px rgba(0,0,0,.3); }
.pk-modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid #DCE4DE; }
.pk-modal-head h2 { margin:0; font-size:18px; font-weight:800; }
.pk-modal-body { padding:18px; display:flex; flex-direction:column; gap:16px; }
.pk-modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:14px 18px; border-top:1px solid #DCE4DE; }
.pk-field label { display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--soft); margin-bottom:6px; }
.pk-field input, .pk-field textarea { width:100%; padding:10px 12px; border:1px solid #A8BAAD; border-radius:3px; background:#fff; }
.pk-field textarea { resize:vertical; min-height:70px; line-height:1.55; }
.pk-err { color:var(--red); font-size:12.5px; margin:6px 0 0; }
.pk-catrow { display:flex; flex-wrap:wrap; gap:6px; }
.pk-linkrow { display:flex; gap:7px; margin-bottom:8px; }
.pk-linkrow input:first-child { flex:0 0 116px; }
.pk-linkrow input:nth-child(2) { flex:1; min-width:0; }
.pk-quick { display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
.pk-quick button { font-size:12.5px; border:1px dashed #A8BAAD; background:transparent; border-radius:3px; padding:5px 9px; cursor:pointer; color:var(--soft); }
.pk-menu { display:inline-flex; align-items:center; gap:5px; text-decoration:none; font-size:13px; font-weight:700; color:var(--ink); background:transparent; border:1px solid var(--ink); border-radius:3px; padding:6px 11px; }
.pk-menu:hover { background:var(--ink); color:var(--paper); }
.pk-menu-prev { display:block; max-width:100%; max-height:220px; object-fit:contain; border:1px solid #DCE4DE; border-radius:3px; margin-bottom:8px; background:#fff; }
.pk-upload { display:inline-flex; align-items:center; font-size:12.5px; border:1px dashed #A8BAAD; background:transparent; border-radius:3px; padding:5px 9px; cursor:pointer; color:var(--soft); }
.pk-upload:hover { border-style:solid; color:var(--ink); }
.pk-upload.is-busy { opacity:.6; cursor:default; }
.pk-upload input[type=file] { display:none; }
.pk-lb { position:fixed; inset:0; background:rgba(27,33,29,.88); display:flex; align-items:center; justify-content:center; padding:24px; z-index:70; }
.pk-lb img { max-width:100%; max-height:100%; object-fit:contain; border-radius:3px; background:#fff; }
.pk-lb-x { position:absolute; top:14px; right:16px; border:0; background:transparent; color:#fff; cursor:pointer; padding:6px; line-height:0; }
.pk-lb-x:hover { opacity:.7; }
button.pk-menu { cursor:pointer; font-family:inherit; }
.pk-tp { display:inline-flex; align-items:center; gap:2px; }
.pk-tp select { padding:4px 5px; border:1px solid #A8BAAD; border-radius:3px; font-family:var(--mono); font-size:12.5px; background:#fff; }
.pk-tp select:disabled { color:#B3C0B7; background:#F1F5F2; }
.pk-colon { font-family:var(--mono); color:var(--soft); }
.pk-hint { font-size:12px; color:var(--soft); line-height:1.6; margin:6px 0 0; }
.pk-hours { border:1px solid #DCE4DE; border-radius:3px; padding:10px 11px; background:#fff; }
.pk-day { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:4px 0; border-bottom:1px dashed #E8EDE9; }
.pk-day:last-of-type { border-bottom:0; }
.pk-day-name { font-family:var(--mono); font-size:12px; color:var(--soft); flex:0 0 34px; }
.pk-range { display:inline-flex; align-items:center; gap:3px; }
.pk-range input[type=time] { padding:4px 6px; border:1px solid #A8BAAD; border-radius:3px; font-family:var(--mono); font-size:12.5px; }
.pk-dash { color:var(--soft); }
.pk-off { font-family:var(--mono); font-size:12px; color:#93A399; }
.pk-mini { font-size:12px; border:1px dashed #BBCCC1; background:transparent; color:var(--soft); border-radius:3px; padding:3px 8px; cursor:pointer; }
.pk-mini:hover { border-style:solid; color:var(--ink); }
.pk-chip.open.on { background:#2F8F4E; color:#fff; border-color:#2F8F4E; }
.pk-quick button:hover { border-style:solid; color:var(--ink); }

.pk-status { display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12px; color:var(--soft); margin:7px 0 0; }
.pk-dot { width:7px; height:7px; border-radius:50%; background:#9FB3A6; flex:0 0 auto; }
.pk-status.is-ok .pk-dot { background:#2F8F4E; }
.pk-status.is-saving .pk-dot, .pk-status.is-loading .pk-dot { background:var(--amber-d); }
.pk-status.is-error .pk-dot { background:var(--red); }
.pk-status.is-error { color:var(--red); }
.pk-retry { border:1px solid currentColor; background:transparent; color:inherit; font-family:var(--mono); font-size:11px; border-radius:2px; padding:2px 7px; cursor:pointer; margin-left:2px; }
.pk-syncerr { font-family:var(--mono); font-size:11.5px; color:var(--soft); margin:5px 0 0; word-break:break-all; max-width:520px; line-height:1.5; }
.pk-head-actions { display:flex; gap:10px; flex-wrap:wrap; }
.pk-banner { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; background:var(--paper); border:1px solid #C6D2C9; border-left:4px solid var(--amber-d); border-radius:3px; padding:14px 16px; margin-bottom:20px; }
.pk-banner-t { margin:0; font-weight:800; font-size:15.5px; }
.pk-banner-s { margin:5px 0 0; font-size:13px; color:var(--soft); }
.pk-banner-a { display:flex; gap:8px; flex-wrap:wrap; }
.pk-share-box { width:100%; min-height:88px; padding:10px 12px; border:1px solid #A8BAAD; border-radius:3px; background:#fff; font-family:var(--mono); font-size:12px; line-height:1.5; resize:vertical; word-break:break-all; }
.pk-toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--red); color:#fff; font-size:13.5px; padding:10px 16px; border-radius:3px; z-index:60; }

@media (max-width:560px) {
  .pk-title { font-size:30px; }
  .pk-sign { flex-direction:column; }
  .pk-roll { border-left:0; border-top:2px dashed rgba(107,78,12,.4); flex-direction:row; padding:13px; }
  .pk-sign-name { font-size:27px; }
}
@media (prefers-reduced-motion: reduce) {
  .pk * { transition:none !important; animation:none !important; }
}
